<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout - AuctionHub</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo">
                    <i class="fas fa-gavel"></i>
                    <span>AuctionHub</span>
                </div>
                <h2>Logout</h2>
                <p>Click below to revoke your session and return to login.</p>
            </div>
            <div class="auth-actions" style="text-align:center;">
                <button class="btn btn-primary" type="button" data-action="logout">
                    <i class="fas fa-door-open"></i>
                    Logout
                </button>
                <a href="index.html" class="btn btn-outline" style="margin-left:12px;">Cancel</a>
            </div>
        </div>
    </div>
    <script src="js/auth.js"></script>
</body>
</html>
