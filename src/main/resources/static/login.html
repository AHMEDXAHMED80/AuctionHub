<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AuctionHub</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <i class="fas fa-gavel"></i>
                <span>AuctionHub</span>
            </a>
            <div class="nav-links">
                <span class="nav-username hidden" data-nav="welcome"></span>
                <a href="items.html" class="btn btn-outline hidden" data-nav="items">
                    <i class="fas fa-box"></i>
                    My Items
                </a>
                <a href="login.html" class="btn btn-outline" data-nav="login">Login</a>
                <a href="register.html" class="btn btn-primary" data-nav="register">Sign Up</a>
                <button type="button" class="btn btn-outline hidden" data-nav="logout" data-action="logout">Logout</button>
            </div>
        </div>
    </nav>

    <!-- Login Form -->
    <section class="auth-page">
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-header">
                    <h1>Welcome Back</h1>
                    <p>Sign in to continue bidding</p>
                </div>

                <div id="alert" class="alert">
                    <span id="alert-message"></span>
                </div>

                <form id="loginForm" class="auth-form">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            placeholder="Enter your email"
                            required
                        >
                        <span class="error-message">Please enter a valid email</span>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="password-input">
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                placeholder="Enter your password"
                                required
                            >
                            <button type="button" class="password-toggle" onclick="togglePassword('password')">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <span class="error-message">Password is required</span>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn">
                        <span id="btnText">Sign In</span>
                        <div id="btnSpinner" class="spinner" style="display: none;"></div>
                    </button>
                </form>

                <div class="form-footer">
                    <p>Don't have an account? <a href="register.html">Create one</a></p>
                </div>
            </div>
        </div>
    </section>

    <script src="js/auth.js"></script>
</body>
</html>
